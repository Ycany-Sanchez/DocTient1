{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account - DocTient</title>
    <link rel="stylesheet" href="{% static 'css/site.css' %}">
    <link rel="stylesheet" href="{% static 'css/register/register.css' %}">
</head>
<body class="auth-page">
    <div class="auth-card">
        <div class="auth-header">
            <span class="auth-brand-logo">DocTient</span>
            <h2>Get Started</h2>
            <p>Create your new DocTient workspace account</p>
        </div>

        {% if error %}
            <div class="message error">{{ error }}</div>
        {% endif %}

        <form method="post" class="auth-form">
            {% csrf_token %}
            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" id="username" name="username" placeholder="Choose a username" required autofocus>
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" placeholder="Choose a secure password" required>
            </div>
            <div class="form-group">
                <label for="full_name">Full Name</label>
                <input type="text" id="full_name" name="full_name" placeholder="e.g. Juan Dela Cruz">
            </div>
            <div class="form-group">
                <label>I am a</label>
                <div class="role-picker">
                    <label class="role-option">
                        <input type="radio" name="role" value="patient" checked>
                        <span><strong>Patient</strong><small>View my own vitals</small></span>
                    </label>
                    <label class="role-option">
                        <input type="radio" name="role" value="doctor">
                        <span><strong>Doctor</strong><small>View my patients' vitals</small></span>
                    </label>
                </div>
            </div>
            <div class="form-group" id="specialtyGroup" style="display:none;">
                <label for="med_specialty">Medical Specialty (doctors)</label>
                <input type="text" id="med_specialty" name="med_specialty" placeholder="e.g. Cardiology">
            </div>
            <button type="submit" class="btn-pill-action" style="width: 100%; justify-content: center; margin-top: 10px;">
                Create Account
                <span class="btn-arrow-disc">➔</span>
            </button>
        </form>

        <div class="auth-footer">
            Already registered? <a href="{% url 'login:login' %}">Sign in here</a>
        </div>
    </div>
    <script>
        document.querySelectorAll('input[name="role"]').forEach((el) => {
            el.addEventListener("change", () => {
                document.getElementById("specialtyGroup").style.display =
                    document.querySelector('input[name="role"]:checked').value === "doctor" ? "block" : "none";
            });
        });
    </script>
    <script src="{% static 'js/register/register.js' %}"></script>
</body>
</html>
